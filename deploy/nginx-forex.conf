# /etc/nginx/sites-available/forex  (then: ln -s ../sites-available/forex /etc/nginx/sites-enabled/)
server {
    listen 80;
    server_name forex.example.com 192.168.1.10;
    client_max_body_size 10M;

    location /static/ { alias /opt/forex/staticfiles/; expires 7d; }
    location /media/  { alias /opt/forex/static/img/; }
    # Customer ID scans must not be public:
    location /media/customer_ids/ { deny all; }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# For HTTPS with a public domain: apt install certbot python3-certbot-nginx && certbot --nginx -d forex.example.com
